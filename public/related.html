<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>VMEDA - Related Videos</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="styles.css?v=1.0.8">
  <style>
    .related-shell { display: grid; gap: 20px; }
    .related-hero {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      padding: 22px;
      color: white;
      backdrop-filter: blur(12px);
    }
    .related-hero-title { font-size: 28px; margin-bottom: 8px; line-height: 1.4; }
    .related-hero-copy { color: rgba(255, 255, 255, 0.92); line-height: 1.7; }
    .related-hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .related-hero-link {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 16px; border-radius: 999px; text-decoration: none;
      font-weight: 700; background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22); color: white;
    }
    .related-summary { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .related-summary-badge {
      display: inline-flex; align-items: center; border-radius: 999px;
      padding: 8px 12px; background: rgba(255, 255, 255, 0.15);
      color: white; font-size: 13px; font-weight: 700;
    }
    .related-screen-list { display: grid; gap: 18px; }
    .related-screen-card {
      background: white; color: #1f2937; border-radius: 18px;
      overflow: hidden; box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
    }
      .related-screen-thumb {
        width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
        display: block; background: #111827;
      }
      .related-screen-media,
      .related-screen-title-button {
        appearance: none; border: none; background: transparent; padding: 0;
        margin: 0; cursor: pointer; text-align: left; width: 100%;
      }
      .related-screen-body { padding: 16px; display: grid; gap: 10px; }
      .related-screen-title { font-size: 18px; font-weight: 700; line-height: 1.5; }
    .related-screen-copy { color: #475569; line-height: 1.6; font-size: 14px; }
    .related-screen-meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .related-screen-badge {
      display: inline-flex; align-items: center; padding: 6px 10px;
      border-radius: 999px; font-size: 12px; font-weight: 700;
      background: #dbeafe; color: #1d4ed8;
    }
    .related-screen-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .related-screen-action {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; padding: 10px 14px; font-weight: 700;
      text-decoration: none; border: none; cursor: pointer;
    }
    .related-screen-action-primary { background: #2563eb; color: white; }
    .related-screen-action-secondary { background: #e2e8f0; color: #0f172a; }
    .related-screen-empty {
      background: rgba(255, 255, 255, 0.12);
      border: 1px dashed rgba(255, 255, 255, 0.35);
      border-radius: 18px; padding: 24px; color: white;
      line-height: 1.7; text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="top-links">
        <a class="top-link" href="/">検索</a>
        <a class="top-link" href="/recommend.html">おすすめ</a>
        <a class="top-link top-link-accent" href="/related.html">関連動画</a>
      </div>
      <h1 class="site-title">VMEDA Related Videos</h1>
      <p class="header-debug-hint">VMEDA 内で関連動画だけをまとめて見て、そのまま次へ辿れるページです。</p>
    </header>

    <main class="related-shell">
      <section class="related-hero">
        <h2 id="related-seed-title" class="related-hero-title">関連動画</h2>
        <p id="related-seed-copy" class="related-hero-copy">動画を選ぶと、このページに関連動画が並びます。</p>
        <div class="related-summary">
          <span id="related-count-badge" class="related-summary-badge">0 件</span>
          <span id="related-query-badge" class="related-summary-badge">関連候補</span>
        </div>
        <div class="related-hero-actions">
          <a id="related-back-search" class="related-hero-link" href="/">検索へ戻る</a>
          <a id="related-open-source" class="related-hero-link" href="/" target="_blank" rel="noopener noreferrer">元動画を開く</a>
        </div>
      </section>

      <section id="related-screen-list" class="related-screen-list"></section>
    </main>
  </div>

  <script>
    function escapeHtml(text) {
      return String(text || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function normalizeThumbnail(url, title) {
      const value = String(url || '').trim();
      if (!value) {
        return `https://via.placeholder.com/640x360/1d4ed8/ffffff?text=${encodeURIComponent((title || 'VMEDA').slice(0, 24))}`;
      }
      if (value.startsWith('//')) return 'https:' + value;
      if (value.startsWith('http://')) return value.replace('http://', 'https://');
      return value;
    }

    function normalizeBilibiliPageUrl(url) {
      const raw = String(url || '').trim();
      if (!raw) return '';
      const bvidMatch = raw.match(/BV[a-zA-Z0-9]+/);
      if (bvidMatch) return `https://www.bilibili.com/video/${bvidMatch[0]}/`;
      if (raw.startsWith('//')) return `https:${raw}`;
      if (raw.startsWith('/video/')) return `https://www.bilibili.com${raw}`;
      if (raw.startsWith('video/')) return `https://www.bilibili.com/${raw}`;
      if (raw.startsWith('http://')) return raw.replace('http://', 'https://');
      return raw;
    }

    function buildBilibiliEmbedUrl(url) {
      const raw = String(url || '').trim();
      const bvidMatch = raw.match(/BV[a-zA-Z0-9]+/);
      if (bvidMatch) return `https://player.bilibili.com/player.html?bvid=${bvidMatch[0]}`;
      if (raw.includes('player.bilibili.com')) return raw.startsWith('//') ? `https:${raw}` : raw;
      return normalizeBilibiliPageUrl(raw);
    }

    function buildFallbackQueries(query) {
      const base = String(query || '').trim();
      if (!base) return [];

      const variants = new Set([base]);
      const cleaned = base.replace(/[【】\[\]（）()「」『』]/g, ' ').replace(/\s+/g, ' ').trim();
      if (cleaned) variants.add(cleaned);

      cleaned
        .split(/[\s\-_/|]+/)
        .map((part) => part.trim())
        .filter((part) => part.length >= 2)
        .slice(0, 4)
        .forEach((part) => variants.add(part));

      return Array.from(variants).slice(0, 5);
    }

    async function fetchSearchFallback(query, currentUrl) {
      const queries = buildFallbackQueries(query);
      if (!queries.length) return [];

      const merged = [];
      const seen = new Set();

      for (const candidate of queries) {
        try {
          const response = await fetch('/api/search', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: candidate })
          });
          if (!response.ok) continue;

            const data = await response.json();
            const normalized = (Array.isArray(data.results) ? data.results : [])
              .map((item) => ({
                ...item,
                url: normalizeBilibiliPageUrl(item.url || item.embedUrl || ''),
                embedUrl: buildBilibiliEmbedUrl(item.embedUrl || item.url || '')
              }))
              .filter((item) => item && item.url && item.url !== currentUrl);

          for (const item of normalized) {
            if (seen.has(item.url)) continue;
            seen.add(item.url);
            merged.push(item);
            if (merged.length >= 24) return merged;
          }
        } catch (error) {
          continue;
        }
      }

      return merged;
    }

    const HOMEPAGE_PLAYBACK_KEY = 'vmeda_homepage_playback';

    function queueHomepagePlayback(video, relatedVideos = []) {
        const normalizedUrl = normalizeBilibiliPageUrl(video?.url || video?.embedUrl || '');
        const normalizedEmbedUrl = buildBilibiliEmbedUrl(video?.embedUrl || video?.url || '');
        if (!normalizedUrl) return;

        try {
          localStorage.setItem(HOMEPAGE_PLAYBACK_KEY, JSON.stringify({
            ...video,
            url: normalizedUrl,
            embedUrl: normalizedEmbedUrl || normalizedUrl,
            source: video?.source || 'bilibili',
            relatedVideos
          }));
        } catch (error) {}

      window.location.href = '/';
    }

    function renderRelatedCards(items, query) {
        return items.map((item, index) => {
          const itemTitle = escapeHtml(item.title || '関連動画');
          const thumb = escapeHtml(normalizeThumbnail(item.thumbnail, item.title));
          const url = escapeHtml(item.url || '');
          const duration = item.duration ? `<span class="related-screen-badge">${escapeHtml(item.duration)}</span>` : '';
          const nextQuery = encodeURIComponent(item.title || query || '');
          const nextRelatedHref = `/related.html?url=${encodeURIComponent(item.url || '')}&title=${encodeURIComponent(item.title || '')}&q=${nextQuery}`;

          return `
            <article class="related-screen-card">
              <button type="button" class="related-screen-media related-screen-play" data-index="${index}">
                <img class="related-screen-thumb" src="${thumb}" alt="${itemTitle}" loading="lazy">
              </button>
              <div class="related-screen-body">
                <button type="button" class="related-screen-title-button related-screen-play" data-index="${index}">
                  <div class="related-screen-title">${index + 1}. ${itemTitle}</div>
                </button>
                <p class="related-screen-copy">この動画を起点に、さらに関連動画へ進めます。</p>
                <div class="related-screen-meta">
                  <span class="related-screen-badge">Bilibili</span>
                  ${duration}
                </div>
                <div class="related-screen-actions">
                  <a class="related-screen-action related-screen-action-primary" href="${nextRelatedHref}">この動画の関連を見る</a>
                  <button type="button" class="related-screen-action related-screen-action-secondary related-screen-play" data-index="${index}">トップで再生</button>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

    async function initRelatedScreen() {
      const params = new URLSearchParams(window.location.search);
      const videoUrl = normalizeBilibiliPageUrl(params.get('url') || '');
      const title = params.get('title') || '';
      const query = params.get('q') || title || '';

      const titleEl = document.getElementById('related-seed-title');
      const copyEl = document.getElementById('related-seed-copy');
      const countBadgeEl = document.getElementById('related-count-badge');
      const queryBadgeEl = document.getElementById('related-query-badge');
      const backSearchEl = document.getElementById('related-back-search');
      const openSourceEl = document.getElementById('related-open-source');
      const listEl = document.getElementById('related-screen-list');

      if (titleEl) titleEl.textContent = title || '関連動画';
      if (copyEl) {
        copyEl.textContent = query
          ? `「${query}」に近い関連動画を表示しています。VMEDA 内でそのまま次へ辿れます。`
          : '選んだ動画をもとに関連動画を表示しています。';
      }
      if (queryBadgeEl) queryBadgeEl.textContent = query ? `起点: ${query}` : '関連候補';
      if (backSearchEl) backSearchEl.href = query ? `/?q=${encodeURIComponent(query)}` : '/';
      if (openSourceEl) openSourceEl.href = videoUrl || '/';

      if (!videoUrl || !videoUrl.includes('bilibili.com')) {
        listEl.innerHTML = '<div class="related-screen-empty">元動画のURLが見つかりませんでした。</div>';
        return;
      }

      listEl.innerHTML = '<div class="related-screen-empty">関連動画を読み込み中...</div>';

      try {
        const apiParams = new URLSearchParams({ url: videoUrl, title });
        const response = await fetch(`/api/bilibili-related?${apiParams.toString()}`);
        let items = [];

        if (response.ok) {
          const data = await response.json();
          items = (Array.isArray(data.results) ? data.results : [])
            .map((item) => ({
              ...item,
              url: normalizeBilibiliPageUrl(item.url || item.embedUrl || ''),
              embedUrl: buildBilibiliEmbedUrl(item.embedUrl || item.url || '')
            }))
            .filter((item) => item && item.url && item.url !== videoUrl);
        }

        if (!items.length) {
          items = await fetchSearchFallback(query || title, videoUrl);
        }

        if (countBadgeEl) countBadgeEl.textContent = `${items.length} 件`;

        if (!items.length) {
          listEl.innerHTML = '<div class="related-screen-empty">関連動画はまだ見つかりませんでした。</div>';
          return;
        }

          listEl.innerHTML = renderRelatedCards(items, query || title);
          listEl.querySelectorAll('.related-screen-play').forEach((button) => {
            button.addEventListener('click', () => {
              const item = items[Number(button.dataset.index)];
              if (!item) return;
              queueHomepagePlayback(item, items.filter((candidate) => candidate.url !== item.url));
            });
          });
        } catch (error) {
          const fallbackItems = await fetchSearchFallback(query || title, videoUrl);
          if (countBadgeEl) countBadgeEl.textContent = `${fallbackItems.length} 件`;

        if (!fallbackItems.length) {
          listEl.innerHTML = '<div class="related-screen-empty">関連動画の取得に失敗しました。</div>';
          return;
        }

          listEl.innerHTML = renderRelatedCards(fallbackItems, query || title);
          listEl.querySelectorAll('.related-screen-play').forEach((button) => {
            button.addEventListener('click', () => {
              const item = fallbackItems[Number(button.dataset.index)];
              if (!item) return;
              queueHomepagePlayback(item, fallbackItems.filter((candidate) => candidate.url !== item.url));
            });
          });
        }
      }

    initRelatedScreen();
  </script>
</body>
</html>
