<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BiliBili-VMEDA</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="styles.css?v=1.1.1">
</head>
<body>
  <div class="page-shell page-shell-simple">
    <header class="app-topbar app-topbar-simple">
      <div class="app-brand">
        <div class="app-brand-badge">B</div>
        <div class="app-brand-copy">
          <div class="app-brand-title">BiliBili-VMEDA</div>
          <div class="app-brand-subtitle">Simple search and related videos</div>
        </div>
      </div>
      <nav class="app-nav">
        <a class="top-link top-link-active" href="/">検索</a>
        <a class="top-link top-link-accent" href="/recommend.html">おすすめ</a>
      </nav>
    </header>

    <main class="container container-simple">
      <section class="simple-hero">
        <div class="simple-hero-copy">
          <span class="hero-kicker">Simple mode</span>
          <h1 class="site-title">BiliBili-VMEDA</h1>
          <p class="hero-description">検索して、そのまま再生して、関連動画を辿るためのシンプルなトップページです。</p>
        </div>

        <div class="search-section hero-search-card simple-search-card">
          <div class="search-card-header">
            <div class="search-card-title">動画を探す</div>
            <div class="search-card-subtitle">タイトル、品番、出演者名などで検索</div>
          </div>
          <div class="search-container">
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Bilibili の動画を検索..."
              autocomplete="off"
            >
            <button id="search-btn" class="search-btn">検索</button>
          </div>
        </div>
      </section>

      <section class="content-surface content-surface-simple">
        <div class="section-header">
          <div>
            <div class="section-title">検索結果</div>
            <p class="section-caption">再生、関連動画、閲覧導線をまとめて表示します。</p>
          </div>
        </div>

        <div id="loading" class="loading hidden">検索中...</div>

        <div id="sort-container" class="sort-container hidden">
          <label for="sort-select" class="sort-label">並び替え</label>
          <select id="sort-select" class="sort-select">
            <option value="default">デフォルト</option>
            <option value="duration-desc">再生時間が長い順</option>
            <option value="duration-asc">再生時間が短い順</option>
            <option value="date-desc">新しい順</option>
            <option value="date-asc">古い順</option>
            <option value="title-asc">タイトル A-Z</option>
            <option value="title-desc">タイトル Z-A</option>
            <option value="source-asc">ソース順</option>
          </select>
        </div>

        <div id="results" class="results"></div>
      </section>
    </main>

    <div id="site-frame-wrap" class="site-frame-wrap hidden">
      <div class="site-frame-toolbar">
        <button type="button" id="site-frame-back" class="site-frame-back">VMEDA に戻る</button>
        <div class="site-frame-nav">
          <button type="button" id="site-frame-history-back" class="site-frame-nav-btn" title="戻る">← 戻る</button>
          <button type="button" id="site-frame-history-forward" class="site-frame-nav-btn" title="進む">進む →</button>
        </div>
        <button type="button" id="vmeda-debug-toggle" class="vmeda-debug-toggle" title="サイトデバッグ (Ctrl+Shift+D)">VMEDA デバッグ</button>
      </div>
      <div id="vmeda-debug-panel" class="vmeda-debug-panel hidden">
        <div class="vmeda-debug-header">VMEDA デバッグ</div>
        <div class="vmeda-debug-row"><label>プロキシURL:</label><input id="vmeda-debug-proxy-url" class="vmeda-debug-input" readonly></div>
        <div class="vmeda-debug-row"><label>実URL:</label><input id="vmeda-debug-real-url" class="vmeda-debug-input" readonly></div>
        <div class="vmeda-debug-row"><label>状態:</label><pre id="vmeda-debug-stats" class="vmeda-debug-stats"></pre></div>
        <div class="vmeda-debug-actions">
          <button type="button" id="vmeda-debug-copy-url" class="vmeda-debug-btn">URLコピー</button>
          <button type="button" id="vmeda-debug-copy-all" class="vmeda-debug-btn">全部コピー</button>
          <button type="button" id="vmeda-debug-open-tab" class="vmeda-debug-btn">新しいタブで開く</button>
        </div>
      </div>
      <iframe id="site-frame" class="site-frame" title="サイト表示" allow="fullscreen; autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>
  </div>

  <script src="app.js?v=1.0.36"></script>
</body>
</html>
